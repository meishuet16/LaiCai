services:
  - type: web
    name: laicai-api
    runtime: python
    region: singapore
    rootDir: .
    buildCommand: pip install -r requirements-render.txt
    startCommand: gunicorn render_wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
  - type: web
    name: laicai-dashboard-api
    runtime: python
    region: singapore
    rootDir: .
    buildCommand: pip install -r requirements-dashboard-render.txt
    startCommand: python -m scripts.start_render_dashboard
    healthCheckPath: /health
    autoDeployTrigger: "off"
